name: Release

# 打 tag（v1.6.0 形式，与 versionName 一致）自动构建 release APK 并上传到 GitHub Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 必须显式指定 packages：该 action 的默认值是 `tools platform-tools`，
          # 其中 `tools` 是**已废弃的 legacy 包**，会连带要求
          # `android-sdk-preview-license`。实测该许可证在 CI 里无法被自动接受
          # （日志：`Accept? (y/N):` 后卡住 → 步骤失败），
          # 导致整个 release 构建在 "Set up Android SDK" 就中断。
          #
          # 这里只装项目真正需要的三项，与 app/build.gradle.kts 对齐：
          #   compileSdk = 35 / buildToolsVersion = "35.0.0" / 无 NDK
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          # 静默接受许可证：否则日志会被整段许可证正文刷屏，淹没真正的错误
          log-accepted-android-sdk-licenses: false

      - name: Decode signing keystore
        env:
          KS_BASE64: ${{ secrets.KS_BASE64 }}
        run: |
          mkdir -p app/keystore
          echo "$KS_BASE64" | base64 -d > app/keystore/release.jks

      - name: Build release APK
        env:
          KS_FILE: ${{ github.workspace }}/app/keystore/release.jks
          KS_PASS: ${{ secrets.KS_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          # 产物名兼容两种情况：
          #  - app/build.gradle.kts 的 androidComponents 逻辑已把它命名为
          #    LogLab_v<version>.apk（这是常态）；
          #  - 该逻辑用反射调 outputFileName，失败时会静默退回 AGP 默认的
          #    app-release.apk。
          # 因此这里不写死文件名，而是取目录里唯一的 .apk，
          # 再统一按 tag 重命名（附件名与 tag 严格一致，便于用户对应版本）。
          set -e
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
          if [ -z "$SRC" ]; then
            echo "::error::构建产物不存在，release 目录下没有 .apk"
            exit 1
          fi
          echo "找到产物: $SRC ($(stat -c%s "$SRC") 字节)"
          DEST="dist/LogLab_v${GITHUB_REF_NAME#v}.apk"
          cp "$SRC" "$DEST"
          echo "已重命名为: $DEST"

      - name: Resolve release notes
        id: notes
        run: |
          # 用仓库里的 RELEASE_NOTES_v<tag>.md 作为 Release 正文。
          #
          # 之前漏了这一步，导致 Release 页面只有附件、没有任何更新说明 ——
          # 用户在 GitHub 上完全看不到"这次更新带来了什么"，
          # 而辛苦写好的 RELEASE_NOTES 文件也从未被引用。
          #
          # 文件缺失时不能让 action 失败（那会连 APK 都发布不了），
          # 故这里先判断存在性，并给出最小兜底文案。
          set -e
          TAG="${GITHUB_REF_NAME}"
          FILE="RELEASE_NOTES_${TAG}.md"
          if [ -f "$FILE" ]; then
            echo "使用更新说明: $FILE"
            echo "path=$FILE" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::$FILE 不存在，Release 正文将使用兜底文案"
            printf '## %s\n\n详见 [CHANGELOG.md](CHANGELOG.md)。\n' "$TAG" > /tmp/fallback-notes.md
            echo "path=/tmp/fallback-notes.md" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LogLab_v*.apk
          body_path: ${{ steps.notes.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
