# 沙箱内存波动大（实测 2.4 ~ 4.1GB，其余被宿主其它进程占用）：
# daemon heap + metaspace + kotlin daemon 必须留出余量，否则 R8 阶段会
# "Gradle build daemon disappeared unexpectedly"（cgroup OOM）或直接
# java.lang.OutOfMemoryError: Java heap space，且重度 swap 会让构建从
# 5 分钟劣化到 20 分钟以上。
#
# ⚠️ 关键（2026-09-21 查明）：**R8 不在 Gradle daemon 里运行**。
# AGP 通过 WorkerExecutor 把 R8 派发到**独立 worker 进程**，它有自己的堆，
# 不继承 org.gradle.jvmargs。因此只调大下面那行对 R8 无效 ——
# 必须同时设置 android.r8.maxHeapSize 才能解决 R8 的 OOM。
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
# ⚠️ 注意：AGP 8.7.3 **没有** android.r8.maxHeapSize 这个属性
# （查证方式：解包 gradle-8.7.3.jar 看 IntegerOption，只有 android.r8.maxWorkers）。
# R8 通过 WorkerExecutor.processIsolation 在**独立 JVM** 中运行，其堆不受
# org.gradle.jvmargs 控制，也没有公开的配置入口。
# 因此本项目的解法是**降低 R8 工作量**：见 app/proguard-rules.pro 的 -dontoptimize。
android.r8.maxWorkers=1
# JDK 路径不写死：由 JAVA_HOME / CI 的 setup-java 提供（沙箱为 /opt/java/jdk-17）
org.gradle.parallel=false
org.gradle.workers.max=1
# Kotlin daemon 走独立进程，内存与 Gradle daemon 相加受 cgroup 约束
kotlin.daemon.jvmargs=-Xmx1024m
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# 沙箱网络受限：禁止 AGP 联网探测/下载缺失的 SDK 组件（build-tools 等）
android.builder.sdkDownload=false
kotlin.code.style=official
systemProp.org.gradle.internal.http.connectionTimeout=15000
systemProp.org.gradle.internal.http.socketTimeout=15000
