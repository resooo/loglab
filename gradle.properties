# 沙箱内存吃紧（实测可用 ~3.5GB，其余被宿主其它进程占用）：
# daemon heap + metaspace + kotlin daemon 必须留出余量，否则 R8 阶段会
# "Gradle build daemon disappeared unexpectedly"（cgroup OOM）或直接
# java.lang.OutOfMemoryError: Java heap space，且重度 swap 会让构建从
# 5 分钟劣化到 12 分钟以上。
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
# JDK 路径不写死：由 JAVA_HOME / CI 的 setup-java 提供（沙箱为 /opt/java/jdk-17）
org.gradle.parallel=false
org.gradle.workers.max=1
# Kotlin daemon 走独立进程，内存与 Gradle daemon 相加受 cgroup 约束
kotlin.daemon.jvmargs=-Xmx1024m
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# 沙箱网络受限：禁止 AGP 联网探测/下载缺失的 SDK 组件（build-tools 等）
android.builder.sdkDownload=false
kotlin.code.style=official
systemProp.org.gradle.internal.http.connectionTimeout=15000
systemProp.org.gradle.internal.http.socketTimeout=15000
